  <style>
    :root { color-scheme: dark; background: #031923; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    html { background: #031923; }
    body {
      background: #031923;
      color: #e3d9cb;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      position: relative;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      overflow: hidden;
      background: #031923;
    }
    /* Each composition fills the viewport without stretching. The portrait
       source carries its own lettering, so a narrow crop cannot cut the name. */
    .artwork {
      position: absolute;
      inset: 0;
      display: block;
    }
    .approved-artwork {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Preserve the arch crown when an ultrawide viewport crops the floor. */
      object-position: 50% 12%;
      animation: reveal 850ms ease-out both;
    }
    @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .approved-artwork { animation: none; }
    }
    /* Portrait and square tablets use a genuinely recomposed image. Its text
       sits well within device safe areas; padding would recreate blank bands. */
    @media (max-aspect-ratio: 1 / 1) {
      .approved-artwork {
        object-position: 50% 35%;
      }
    }
    .sr-only {
      border: 0 !important;
      clip: rect(0, 0, 0, 0) !important;
      clip-path: inset(50%) !important;
      height: 1px !important;
      margin: -1px !important;
      overflow: hidden !important;
      padding: 0 !important;
      position: absolute !important;
      white-space: nowrap !important;
      width: 1px !important;
    }
  </style>
