<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#031923">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Atelier Wagner & Co. — Coming Soon.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Atelier Wagner & Co. — Coming Soon">
  <meta property="og:description" content="Atelier Wagner & Co. — Coming Soon.">
  <meta property="og:site_name" content="Atelier Wagner & Co.">
  <meta property="og:url" content="https://atelierwagnerco.com/">
  <meta property="og:image" content="https://atelierwagnerco.com/assets/atelier-wagner-approved-hero.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>Atelier Wagner & Co. — Coming Soon</title>
  <style>
    :root { color-scheme: dark; background: #031923; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    html { background: #031923; }
    body {
      background: #031923;
      color: #e3d9cb;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      position: relative;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      overflow: hidden;
      background: #031923;
    }
    /* Each composition fills the viewport without stretching. The portrait
       source carries its own lettering, so a narrow crop cannot cut the name. */
    .artwork {
      position: absolute;
      inset: 0;
      display: block;
    }
    .approved-artwork {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Preserve the arch crown when an ultrawide viewport crops the floor. */
      object-position: 50% 12%;
      animation: reveal 850ms ease-out both;
    }
    @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .approved-artwork { animation: none; }
    }
    /* Portrait and square tablets use a genuinely recomposed image. Its text
       sits well within device safe areas; padding would recreate blank bands. */
    @media (max-aspect-ratio: 1 / 1) {
      .approved-artwork {
        object-position: 50% 35%;
      }
    }
    .sr-only {
      border: 0 !important;
      clip: rect(0, 0, 0, 0) !important;
      clip-path: inset(50%) !important;
      height: 1px !important;
      margin: -1px !important;
      overflow: hidden !important;
      padding: 0 !important;
      position: absolute !important;
      white-space: nowrap !important;
      width: 1px !important;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="sr-only">Atelier Wagner &amp; Co.</h1>
    <p class="sr-only">Coming Soon</p>
    <picture class="artwork">
      <source
        media="(min-aspect-ratio: 2 / 1)"
        srcset="assets/atelier-wagner-ultrawide-refined.png"
        width="2048"
        height="768"
      >
      <source
        media="(max-aspect-ratio: 1 / 1)"
        srcset="assets/atelier-wagner-portrait-refined.png"
        width="852"
        height="1846"
      >
      <img
        class="approved-artwork"
        src="assets/atelier-wagner-desktop-refined.png"
        width="1669"
        height="942"
        alt=""
        decoding="async"
        fetchpriority="high"
      >
    </picture>
  </main>
</body>
</html>
