<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#031923">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Atelier Wagner & Co. — Coming Soon.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Atelier Wagner & Co. — Coming Soon">
  <meta property="og:description" content="Atelier Wagner & Co. — Coming Soon.">
  <meta property="og:site_name" content="Atelier Wagner & Co.">
  <meta property="og:url" content="https://atelierwagnerco.com/">
  <meta property="og:image" content="https://atelierwagnerco.com/assets/atelier-wagner-approved-hero.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>Atelier Wagner & Co. — Coming Soon</title>
  <link rel="preload" as="image" href="assets/atelier-wagner-approved-hero.png">
  <style>
    :root { color-scheme: dark; background: #031923; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    html { background: #031923; }
    body {
      background: #031923;
      color: #e3d9cb;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #031923;
    }
    /* A byte-identical copy of the expressly approved final rendering.
       No new overlays, replacement typography, or synthetic effects. */
    .approved-artwork {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100svh;
      max-width: 100%;
      object-fit: contain;
      object-position: center;
      animation: reveal 850ms ease-out both;
    }
    @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .approved-artwork { animation: none; }
    }
    /* Portrait framing enlarges the entrance while retaining all actual text.
       Only the outer curtain edges are cropped; the source file stays unchanged. */
    @media (max-aspect-ratio: 3 / 4) {
      main { position: relative; }
      .approved-artwork {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 164vw;
        height: auto;
        max-width: none;
        max-height: none;
      }
    }
    .sr-only {
      border: 0 !important;
      clip: rect(0, 0, 0, 0) !important;
      clip-path: inset(50%) !important;
      height: 1px !important;
      margin: -1px !important;
      overflow: hidden !important;
      padding: 0 !important;
      position: absolute !important;
      white-space: nowrap !important;
      width: 1px !important;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="sr-only">Atelier Wagner &amp; Co.</h1>
    <p class="sr-only">Coming Soon</p>
    <img
      class="approved-artwork"
      src="assets/atelier-wagner-approved-hero.png"
      width="1669"
      height="942"
      alt=""
      decoding="async"
      fetchpriority="high"
    >
  </main>
</body>
</html>
