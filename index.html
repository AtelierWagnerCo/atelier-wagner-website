    :root {
      color-scheme: dark;
      --ground: #031923;          /* page colour (palette v2) */
      --coming: #D6CCBA;          /* COMING SOON: soft champagne, never white */
      --hairline: #D8C08E;        /* champagne gold hairline */
      --founder: #CDBE9E;
      --edge: rgba(1, 9, 13, .92);/* crisp dark edge so lettering reads on velvet */
      background: var(--ground);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: var(--ground); }
    body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: geometricPrecision; }

    main {
      --vw: 100vw; --vh: 100vh;
      position: relative; width: 100%; height: 100vh; overflow: hidden; background: var(--ground);
    }
    @supports (height: 100svh) { main { height: 100svh; --vh: 100svh; } }
    @supports (height: 100dvh) { main { height: 100dvh; --vh: 100dvh; } }

    /* The stage keeps the photograph's own proportions and covers the screen (like object-fit: cover),
       so the lettering always sits in the same place inside the arch on every screen. */
    .stage {
      /* desktop / laptop / landscape tablet: 1669 x 942 composition */
      --ar: 1.77176; --ox: .5; --oy: .12;
      --axis: 50.15%;
      --cs-top: 27.6%; --rule-top: 33.0%; --name-top: 35.7%;
      --cs-size: calc(.55rem + 1.02cqw);
      --rule-w: calc(1.25rem + 2.4cqw);
      --name-w: calc(6rem + 36.4cqw);
      --w: max(var(--vw), calc(var(--vh) * var(--ar)));
      --h: max(var(--vh), calc(var(--vw) / var(--ar)));
      position: absolute;
      width: var(--w); height: var(--h);
      left: calc((var(--vw) - var(--w)) * var(--ox));
      top: calc((var(--vh) - var(--h)) * var(--oy));
      container-type: size;
    }
    @media (min-aspect-ratio: 2 / 1) {          /* ultrawide: 2048 x 768 composition */
      .stage {
        --ar: 2.66667; --oy: .12; --axis: 49.66%;
        --cs-top: 27.6%; --rule-top: 32.85%; --name-top: 35.7%;
        --cs-size: calc(.5rem + .72cqw);
        --rule-w: calc(1.25rem + 1.7cqw);
        --name-w: calc(5rem + 25.6cqw);
      }
    }
    @media (max-aspect-ratio: 1 / 1) {          /* portrait phones and tablets: 852 x 1846 composition */
      .stage {
        --ar: .461538; --oy: .35; --axis: 50%;
        --cs-top: 35.6%; --rule-top: 38.9%; --name-top: 41.0%;
        --cs-size: calc(.52rem + 1.2cqw);
        --rule-w: calc(1.4rem + 7cqw);
        --name-w: calc(3rem + 41.5cqw);
      }
    }

    .scene, .scene img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .scene img { object-fit: cover; animation: reveal 900ms ease-out both; }

    .lettering > * { position: absolute; left: var(--axis); margin: 0; animation: reveal 1400ms 250ms ease-out both; }

    .coming {
      top: var(--cs-top);
      transform: translate(-50%, -50%);
      font-family: "Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
      font-weight: 400;
      font-size: var(--cs-size);
      line-height: 1;
      letter-spacing: .5em;
      padding-left: .5em;               /* balances the trailing letter-space so the words stay centred */
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--coming);
      text-shadow: 0 1px 0 var(--edge), 0 0 .9em rgba(0, 0, 0, .45);
      font-kerning: normal;
    }
    .rule {
      top: var(--rule-top);
      width: var(--rule-w); height: 1px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, rgba(216,192,142,0), var(--hairline) 22%, var(--hairline) 78%, rgba(216,192,142,0));
      box-shadow: 0 1px 0 rgba(1, 9, 13, .7);
    }
    .name {
      top: var(--name-top);
      width: var(--name-w);
      transform: translateX(-50%);
      font-size: 1rem; font-weight: 400;
    }
    .name svg { display: block; width: 100%; height: auto; overflow: visible; shape-rendering: geometricPrecision; }
    .name .stack { display: none; }
    .name .line { transform: translateY(-4.82%); }
    @media (max-aspect-ratio: 1 / 1) {
      .name .line { display: none; }
      .name .stack { display: block; transform: translateY(-3.39%); }
    }
    /* Portrait: COMING SOON sits fully inside the arch's gold lines. */
    @media (max-aspect-ratio: 1 / 1) { .coming { letter-spacing: .38em; padding-left: .38em; font-weight: 500; } }
    @media (max-aspect-ratio: 1 / 1) and (max-width: 350px) { .coming { letter-spacing: .3em; padding-left: .3em; } }
    /* Phones: give the hairlines and the A's crossbar a little more body so they never disappear. */
    .name g { stroke-width: 0; }
    @media (max-width: 540px) and (max-aspect-ratio: 1 / 1) { .name g { stroke-width: 11px; } }

    /* Optional founder line (off by default): soft italic, lower right. */
    .founder { display: none; }
    .with-founder .founder {
      display: block; position: absolute; left: auto; right: calc(5.5% + env(safe-area-inset-right, 0px)); bottom: calc(5.5% + env(safe-area-inset-bottom, 0px));
      font-family: "Cormorant Garamond", Garamond, serif; font-style: italic; font-weight: 300;
      font-size: calc(1rem + .55vw); letter-spacing: .04em; color: var(--founder);
      text-shadow: 0 1px 0 var(--edge), 0 0 1.2em rgba(0, 0, 0, .55);
      animation: reveal 1600ms 600ms ease-out both; margin: 0;
    }

    .sr-only { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }

    @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .scene img, .lettering > *, .with-founder .founder { animation: none; } }
